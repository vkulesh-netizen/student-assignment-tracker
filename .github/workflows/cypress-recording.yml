name: Cypress recording
on:
  workflow_dispatch:
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cypress install
      - run: npm run test:cypress
        env:
          STUDYLINE_BASE_URL: https://student-assignment-tracker-apbn.onrender.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studyline-cypress-evidence
          path: |
            cypress/videos/
            cypress/screenshots/
